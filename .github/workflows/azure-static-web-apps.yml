name: Azure Static Web Apps CI/CD

# Runs on GitHub's own hosted runners - not on any local machine - which is
# exactly why this route was chosen: the SWA CLI's local deploy binary was
# failing on Windows here for reasons that didn't reproduce anywhere else,
# so building and deploying from a clean, known-good environment sidesteps
# that entirely.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and deploy to Azure Static Web Apps (devtest)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (pointed at the API's devtest slot)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ezcoreapiprod-devtest.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
